<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GROOM Live</title>

```
<link rel="stylesheet" href="{{ url_for('static', filename='live.css') }}">
```

</head>

<body>

<main class="live-app">

```
<header class="topbar">

    <div>
        <div class="brand">
            🤖 GROOM <span>LIVE</span>
        </div>

        <div id="statusText" class="status">
            Connecting camera…
        </div>
    </div>

    <a class="close-btn" href="/">✕</a>

</header>


<section class="call-card">

    <!-- Camera -->
    <div class="video-wrap">

        <video
            id="userVideo"
            autoplay
            playsinline
            muted>
        </video>

        <div class="live-pill">
            <i></i> LIVE
        </div>

        <div id="thinking" class="thinking hidden">
            GROOM is looking…
        </div>

    </div>


    <!-- Controls -->
    <div class="controls">

        <button id="micBtn" class="control">
            🎤
            <small>Mic</small>
        </button>

        <button id="cameraBtn" class="control">
            📷
            <small>Camera</small>
        </button>

        <button id="endBtn" class="control end">
            📞
            <small>End</small>
        </button>

    </div>


    <div class="hint">
        Speak to GROOM using the microphone.
    </div>

</section>
```

</main>

<script src="{{ url_for('static', filename='live.js') }}"></script>

</body>
</html>
