<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>GROOM AI</title>

    

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>



<div class="app">


    <div class="aurora">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>
    
    <div class="sidebar" id="sidebar">

        <button id="backBtn">←</button>
    
        <button id="newChatBtn" onclick="newChat()">
            ➕ New Chat
        </button>
    
        <div id="chatList"></div>
    
    </div>


    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="menuBtn" aria-label="Open chats">☰</button>
            <div class="brand-mark logo" title="GROOM AI">✦</div>
            <div class="brand-copy">
                <h2>GROOM AI</h2>
                <span>AI Assistant</span>
            </div>
        </div>

        <div class="header-actions">
            <button class="model-pill">GROOM 1.0⌄</button>
            <button class="pro-pill">✦ PRO</button>
            <button id="videoCallBtn" class="menu-btn" aria-label="Live mode">◉</button>
        </div>
    </header>

    <div class="chat-container">

        <main id="chat-box">
    
            <div id="welcome" class="welcome">
                <div class="ai-core" id="welcomeRocket" aria-label="GROOM AI core">
                    <span></span><i></i><b></b>
                </div>
                <h1>Hello, I'm <strong>GROOM</strong></h1>
                <p>Your intelligent AI companion</p>

                <div class="welcome-card featured-card" onclick="quickPrompt('Help me build an application')">
                    <div class="card-icon">✦</div>
                    <div class="card-copy">
                        <strong>Build with GROOM</strong>
                        <small>Plan, code and improve your next idea</small>
                    </div>
                    <span class="card-arrow">↗</span>
                </div>

                <div class="welcome-grid">
                    <button class="welcome-card" onclick="quickPrompt('Help me write code')">
                        <span class="card-icon">⌘</span>
                        <span class="card-copy"><strong>Code Helper</strong><small>Build & debug</small></span>
                        <span class="card-arrow">↗</span>
                    </button>
                    <button
                        class="welcome-card"
                        id="webSearchCard"
                        type="button"
                    >
                        <span class="card-icon">🌐</span>

                        <span class="card-copy">
                            <strong>Web Search</strong>
                            <small>Find current information</small>
                        </span>

                        <span class="card-arrow">↗</span>
                    </button>
                </div>

                <div class="welcome-grid">
                    <button class="welcome-card" onclick="quickPrompt('Summarize this chat')">
                        <span class="card-icon">▤</span>
                        <span class="card-copy"><strong>Summarize</strong><small>Quick answers</small></span>
                        <span class="card-arrow">↗</span>
                    </button>
                    <button class="welcome-card" onclick="quickPrompt('Explain this simply')">
                        <span class="card-icon">◌</span>
                        <span class="card-copy"><strong>Explain</strong><small>Make it simple</small></span>
                        <span class="card-arrow">↗</span>
                    </button>
                </div>
            </div>
    
        </main>
    
    </div>

    <footer id="input-area" class="input-area">

        <div class="input-wrapper">
    
            <div id="imagePreviewContainer"></div>
    
            <div class="composer">
                <label for="fileInput" id="attachBtn" title="Attach image or PDF">＋</label>
    
                <input
                    type="file"
                    id="fileInput"
                    accept="image/*,.pdf,application/pdf"
                    hidden
                >
    
                <input
                    id="message"
                    type="text"
                    placeholder="Message GROOM AI..."
                    autocomplete="off"
                >
    
                <button id="micBtn" class="composer-tool" type="button" title="Voice">⌁</button>
                <button id="sendBtn">➤</button>
    
            </div>
    
        </div>
    
    </footer>

    
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
<script>
function quickPrompt(text){
    const el=document.getElementById('message');
    if(!el) return;
    el.value=text;
    el.focus();
    if(typeof sendMessage==='function') sendMessage();
}

const mic=document.getElementById('micBtn');
if(mic && 'webkitSpeechRecognition' in window){
    mic.addEventListener('click',()=>{
        const r=new webkitSpeechRecognition();
        r.lang='en-US';
        r.interimResults=false;
        r.onresult=e=>{ document.getElementById('message').value=e.results[0][0].transcript; };
        r.start();
    });
}
</script>

<div id="cursor-glow"></div>

<div id="imageViewer" class="image-viewer">

    <span class="close-image" onclick="closeImage()">&times;</span>

    <img id="viewerImage">



</div>

<!-- GROOM AI Robot -->
<!-- GROOM AI Robot -->
<!-- ==========================
     GROOM AI ROBOT
========================== -->

<div id="groom-helper">

    <!-- Assistant Panel -->
    <div id="groom-panel">

        <div id="groomPanelContent">

            <div class="panel-title">
                🤖 GROOM Assistant
            </div>

            <!-- Quick Ask -->
            <button class="groom-action" data-action="ask">
                💡 Quick Ask
            </button>

            <div id="quickAskMenu" class="quick-menu">

                <button class="quick-item">
                    📄 Summarize this chat
                </button>

                <button class="quick-item">
                    💻 Help me write code
                </button>

                <button class="quick-item">
                    📝 Write an email
                </button>

                <button class="quick-item">
                    🌍 Translate text
                </button>

                <button class="quick-item">
                    🧠 Explain simply
                </button>

            </div>

            <!-- Main Actions -->
            <button class="groom-action" data-action="web">
                🌐 Search Web
            </button>

            <button class="groom-action" data-action="image">
                🖼️ Generate Image
            </button>

            <button id="summaryBtn" class="groom-action">
                📄 Summarize Chat
            </button>

            <button id="fileBtn" class="groom-action">
                📎 Analyze File
            </button>

            <button id="codeBtn" class="groom-action">
                💻 Code Helper
            </button>

            <button class="groom-action close-panel">
                ❌ Close
            </button>

        </div>

    </div>

    <!-- Robot -->
    <div class="groom-robot">

        <!-- Head -->
        <div class="groom-head">

            <div class="groom-mouth"></div>

            <div class="eye left-eye"></div>

            <div class="eye right-eye"></div>

            <div class="mouth"></div>

        </div>

        <!-- Body -->
        <div class="groom-body">

            <div class="arm left-arm"></div>

            <div class="core"></div>

            <div class="arm right-arm"></div>

        </div>

    </div>

    <!-- Speech Bubble -->
    <div class="groom-message">
        👋 Hi! I'm GROOM.
    </div>

</div>

<div id="videoModal" class="video-modal">

    <div class="video-window">

        <video
            id="camera"
            autoplay
            playsinline
            muted
        ></video>

        <button id="closeVideo">
            End Call
        </button>

    </div>

</div>



</body>
</html>
